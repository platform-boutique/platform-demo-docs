name: CI

# Pull-request gate for the documentation repository: only the secret scan (nothing else to build). Nothing runs on a plain push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2
